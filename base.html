{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sticky Notes{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'notes/css/style.css' %}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><a class="brand" href="{% url 'notes:list' %}"><span aria-hidden="true">▧</span> Sticky Notes</a><span class="tagline">A little space for your thoughts.</span></header>
<main id="main" class="container">
{% if messages %}<div aria-live="polite">{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}</div>{% endif %}
{% block content %}{% endblock %}
</main>
<footer>Your ideas, one note at a time.</footer>
</body>
</html>
