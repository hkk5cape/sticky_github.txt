<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="725" viewBox="0 0 1100 725" role="img" aria-label="Class diagram"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#365746"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243d30;font-size:16px}.title{font-size:26px;font-weight:bold}.box{fill:#f7f8ef;stroke:#365746;stroke-width:1.5}.line{stroke:#365746;stroke-width:1.5;fill:none}.arrow{stroke:#365746;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="45" class="title">Class diagram</text><rect class="box" x="40" y="100" width="440" height="254" rx="4"/><text x="54" y="128">Note : django.db.models.Model</text><path class="line" d="M40 142H480"/><text x="54" y="165">id: BigAutoField (PK)</text><text x="54" y="192">title: CharField(max_length=200)</text><text x="54" y="219">content: TextField</text><text x="54" y="246">created_at: DateTimeField(auto_now_add)</text><text x="54" y="273">updated_at: DateTimeField(auto_now)</text><text x="54" y="300">__str__(): str</text><text x="54" y="327">get_absolute_url(): str</text><rect class="box" x="620" y="100" width="420" height="173" rx="4"/><text x="634" y="128">NoteForm : ModelForm</text><path class="line" d="M620 142H1040"/><text x="634" y="165">Meta.model = Note</text><text x="634" y="192">Meta.fields = [title, content]</text><text x="634" y="219">is_valid(): bool (inherited)</text><text x="634" y="246">save(): Note (inherited)</text><rect class="box" x="620" y="395" width="420" height="200" rx="4"/><text x="634" y="423">CRUD views (Django generic views)</text><path class="line" d="M620 437H1040"/><text x="634" y="460">NoteListView : ListView</text><text x="634" y="487">NoteDetailView : DetailView</text><text x="634" y="514">NoteCreateView : CreateView</text><text x="634" y="541">NoteUpdateView : UpdateView</text><text x="634" y="568">NoteDeleteView : DeleteView</text><path class="arrow" d="M620 180H480"/><text x="490" y="165">edits</text><path class="arrow" d="M830 395V285"/><text x="840" y="330">create / update use</text><path class="arrow" d="M620 560H265V355"/><text x="310" y="540">query / persist / delete</text><text x="40" y="655">Framework inheritance is shown after “:”. All five views set model = Note.</text><text x="40" y="685">NoteForm exposes only editable fields; the ORM manages IDs and timestamps.</text></svg>