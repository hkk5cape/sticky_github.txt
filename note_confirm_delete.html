{% extends 'base.html' %}
{% block title %}Delete note | Sticky Notes{% endblock %}
{% block content %}<section class="form-panel"><p class="eyebrow">DELETE NOTE</p><h1>Ready to let this one go?</h1><p>Delete “<strong>{{ note.title }}</strong>”? This cannot be undone.</p><form method="post">{% csrf_token %}<div class="actions"><button class="danger" type="submit">Yes, delete note</button><a class="button secondary" href="{{ note.get_absolute_url }}">Keep note</a></div></form></section>{% endblock %}
