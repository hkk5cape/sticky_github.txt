<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="810" viewBox="0 0 1100 810" role="img" aria-label="Sequence diagram — create a note"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#365746"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#243d30;font-size:16px}.title{font-size:26px;font-weight:bold}.box{fill:#f7f8ef;stroke:#365746;stroke-width:1.5}.line{stroke:#365746;stroke-width:1.5;fill:none}.arrow{stroke:#365746;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="45" class="title">Sequence diagram — create a note</text><rect class="box" x="15" y="90" width="170" height="50" rx="5"/><text x="23" y="120">User / browser</text><path class="line" stroke-dasharray="5 5" d="M100 140V700"/><rect class="box" x="225" y="90" width="170" height="50" rx="5"/><text x="233" y="120">NoteCreateView</text><path class="line" stroke-dasharray="5 5" d="M310 140V700"/><rect class="box" x="435" y="90" width="170" height="50" rx="5"/><text x="443" y="120">NoteForm</text><path class="line" stroke-dasharray="5 5" d="M520 140V700"/><rect class="box" x="655" y="90" width="170" height="50" rx="5"/><text x="663" y="120">Note model</text><path class="line" stroke-dasharray="5 5" d="M740 140V700"/><rect class="box" x="875" y="90" width="170" height="50" rx="5"/><text x="883" y="120">SQLite database</text><path class="line" stroke-dasharray="5 5" d="M960 140V700"/><path class="arrow" d="M100 185H310"/><text x="108" y="175">GET /notes/new/</text><path class="arrow" d="M310 230H100"/><text x="108" y="220">200: blank form + CSRF token</text><path class="arrow" d="M100 285H310"/><text x="108" y="275">POST title, content, CSRF token</text><path class="arrow" d="M310 330H520"/><text x="318" y="320">Bind data; is_valid()</text><path class="arrow" d="M520 375H310"/><text x="318" y="365">Validated data or errors</text><path class="arrow" d="M310 420H520"/><text x="318" y="410">Valid: form.save()</text><path class="arrow" d="M520 465H740"/><text x="528" y="455">Create Note instance; save()</text><path class="arrow" d="M740 510H960"/><text x="748" y="500">INSERT note</text><path class="arrow" d="M960 555H740"/><text x="748" y="545">New primary key</text><path class="arrow" d="M310 610H100"/><text x="108" y="600">302 redirect to note detail</text><text x="40" y="745">Invalid input: return HTTP 200 with the form and errors; no database insert.</text><text x="40" y="775">GET the redirect target to display the saved note. CSRF middleware validates POST requests.</text></svg>